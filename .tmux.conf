### ───── Terminal & Interface ─────
# True color support
set-option -sa terminal-overrides ",xterm*:Tc"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Mouse support
set -g mouse on

# Scrollback history
set -g history-limit 10000

### ───── Prefix & Keybinds ─────
# Remap prefix from 'Ctrl-b' to 'Ctrl-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Better pane splits (keep current dir)
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Switch windows with Alt-H/L
bind -n M-H previous-window
bind -n M-L next-window

# Vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### ───── Copy Mode ─────
# Use vi keys in copy mode
set-window-option -g mode-keys vi

# Custom keybinds in copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

### ───── Plugins (TPM) ─────
# Plugin list
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tassaron/tmux-df'
set -g @plugin 'nordtheme/tmux'

# Continuum options
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

set -g @cpu_low_icon "▁"
  set -g @cpu_medium_icon "▅"
set -g @cpu_high_icon "█"

# set -g @nord_tmux_show_status_content "0"
set -g status-interval 2
set -g status-right "#[fg=black]#{prefix_highlight}#[fg=brightblack,bg=black]#[fg=white,bg=brightblack] #{cpu_icon} #[fg=brightblack,bg=black]#[fg=white,bg=brightblack] #{df_percent} #[fg=cyan,bg=brightblack]#[fg=black,bg=cyan,bold] #H "

set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"
set -g @tmux_window_name_use_tilde "False"

# TPM initialization
run '~/.tmux/plugins/tpm/tpm'
